name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge-core:
    name: bridge-core (Kotlin/JVM — the tested native-side bridge logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        working-directory: legacy_shell
        run: ./gradlew :bridge-core:test

      # Note: :app (the real Android app, with the Flutter engine embedding
      # wiring) is intentionally not built here — it needs a Flutter engine
      # Maven artifact only `flutter build aar` (with a real local Flutter
      # SDK) can produce. See README.md.

  flutter-module:
    name: flutter_module (Dart — the tested bridge-decode logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Install dependencies
        working-directory: flutter_module
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_module
        run: flutter analyze

      - name: Test
        working-directory: flutter_module
        run: flutter test
